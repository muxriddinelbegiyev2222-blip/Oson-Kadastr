name: Build APK and Web

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodlarni yuklash
        uses: actions/checkout@v4

      - name: Java muhitini o'rnatish
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter o'rnatish
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Android va Web karkasini yaratish
        run: |
          flutter config --enable-web
          flutter create . --org uz.osonkadastr --platforms android,web --project-name oson_kadastr

      - name: Paketlarni yuklash
        run: flutter pub get

      - name: Logotipni sozlash
        run: dart run flutter_launcher_icons || true

      - name: APK yig'ish
        run: flutter build apk --release

      - name: APK faylni yuklab olishga tayyorlash
        uses: actions/upload-artifact@v4
        with:
          name: oson-kadastr-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Web versiyani yig'ish
        run: flutter build web --base-href "/Oson-Kadastr/" --release

      - name: Web saytni GitHub Pages ga chiqarish
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
